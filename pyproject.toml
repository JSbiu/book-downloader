[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-downloader"
version = "0.10.0"
description = "Downloader for publicly accessible, authorized book chapters"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
test = [
    "httpx>=0.27,<1",
]
browser = [
    "playwright>=1.40",
]

[project.scripts]
book-download = "book_downloader.cli:main"

[tool.setuptools.packages.find]
include = ["book_downloader*"]

[tool.setuptools.package-data]
book_downloader = ["web/static/*", "web/extension/*"]
