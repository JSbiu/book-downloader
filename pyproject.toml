[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-downloader"
version = "0.7.4"
description = "Downloader for publicly accessible, authorized book chapters"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
]

[project.scripts]
book-download = "book_downloader.cli:main"

[tool.setuptools.packages.find]
include = ["book_downloader*"]
